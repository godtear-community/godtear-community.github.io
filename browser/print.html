<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print Champion Cards</title>

   <style>
  /* ==========================================================================
     Page setup
     ========================================================================== */

  @page {
    size: Letter landscape;
    margin: 0;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: #ddd;
  }


  /* ==========================================================================
     Configuration screen
     ========================================================================== */

  #configuration {
    max-width: 700px;
    margin: 40px auto;
    padding: 30px;
    background: white;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  #configuration h1 {
    margin-top: 0;
    margin-bottom: 25px;
  }


  /* ==========================================================================
     Selection links
     ========================================================================== */

  .selection-links {
    margin-bottom: 25px;
  }

  .selection-links a {
    display: block;
    margin: 8px 0;
    color: #0645ad;
    text-decoration: underline;
    cursor: pointer;
  }


  /* ==========================================================================
     Champion selection
     ========================================================================== */

  .champion-selection h2 {
    font-size: 18px;
    margin-bottom: 16px;
  }

  .champion-group {
    margin-bottom: 24px;
  }

  .champion-group h3 {
    margin: 0 0 8px 0;
    font-size: 16px;
  }

  .champion-checkbox {
    display: flex;
    align-items: center;
    margin: 6px 0;
    font-size: 15px;
    min-height: 32px;
  }

  .champion-checkbox input {
    margin: 0 8px 0 0;
    flex-shrink: 0;
  }

  .champion-icon-link {
    display: flex;
    align-items: center;
    margin-right: 8px;
    flex-shrink: 0;
  }

  .champion-icon {
    width: 28px;
    height: 28px;
    object-fit: contain;
  }

  /* ==========================================================================
     SCENARIO SELECTION
     ========================================================================== */

    .scenario-group {
        margin-bottom: 24px;
    }

    .scenario-group h3 {
        margin: 0 0 8px 0;
        font-size: 16px;
    }

    .scenario-checkbox {
        display: flex;
        align-items: center;
        margin: 6px 0;
        font-size: 15px;
        min-height: 32px;
    }

    .scenario-checkbox input {
        margin: 0 8px 0 0;
        flex-shrink: 0;
    }

    .scenario-selection-links {
        margin-bottom: 25px;
    }

    .scenario-selection-links a {
        display: block;
        margin: 8px 0;
        color: #0645ad;
        text-decoration: underline;
        cursor: pointer;
    }


  /* ==========================================================================
     Generate button
     ========================================================================== */

  #generate-button {
    margin-top: 10px;
    padding: 10px 24px;
    font-size: 16px;
    cursor: pointer;
  }


  /* ==========================================================================
     Error message
     ========================================================================== */

  .error {
    max-width: 800px;
    margin: 40px auto;
    padding: 20px;

    border: 2px solid #b00020;
    background: #ffe5e5;
    color: #b00020;

    font-size: 18px;
    text-align: center;
  }


  /* ==========================================================================
     Screen print controls
     ========================================================================== */

  .print-controls {
    padding: 20px;
    text-align: center;
  }

  .print-controls button {
    font-size: 16px;
    padding: 8px 18px;
    cursor: pointer;
  }


  /* ==========================================================================
     Printable page

     Letter:
       8.5" × 11"

     Page padding:
       0.25" on all four sides

     Cards:
       2.5" × 3.5"

     Layout:
       3 columns × 3 rows

     There is ZERO spacing between cards.
     ========================================================================== */

  .print-page {
    width: 11in;
    height: 8.5in;

    /*
     * Exactly 0.25" of padding on every side.
     */
    padding: 0.25in;

    /*
     * Three 2.5" cards = 7.5"
     *
     * Available width inside the page:
     * 8.5" - 0.5" padding = 8"
     *
     * justify-content: center therefore leaves:
     * (8" - 7.5") / 2 = 0.25"
     *
     * on the left and right of the card grid.
     */
    display: grid;

    grid-template-columns:
      repeat(3, 2.5in);

    grid-template-rows:
      repeat(2, 3.5in);

    /*
     * Absolutely no spacing between cards.
     */
    gap: 0;

    /*
     * Center the 3 × 3 grid horizontally.
     */
    justify-content: center;

    /*
     * Start the cards at the top of the
     * content area, immediately after the
     * 0.25" top padding.
     */
    align-content: center;

    /*
     * White page background.
     */
    background: white;

    /*
     * Every .print-page starts on a new
     * physical page when printed.
     */
    break-after: page;
    page-break-after: always;
  }


  /* ==========================================================================
     Individual cards
     ========================================================================== */

  .card {
    width: 2.5in;
    height: 3.5in;

    /*
     * No spacing whatsoever around images.
     */
    margin: 0;
    padding: 0;
    border: 0;

    /*
     * Prevent inline-image baseline behavior from
     * introducing unexpected spacing.
     */
    display: block;

    /*
     * Force the image to exactly the card dimensions.
     */
    object-fit: fill;

    /*
     * Keep cards together during printing.
     */
    break-inside: avoid;

    /*
     * Preserve the card artwork when printing.
     */
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .card.upside-down {
    transform: rotate(180deg);
  }


  /* ==========================================================================
     Screen preview
     ========================================================================== */

  @media screen {

    .print-page {
      /*
       * Space between preview pages on screen.
       * This does NOT affect the printed output.
       */
      margin: 20px auto;

      box-shadow:
        0 2px 8px rgba(0, 0, 0, 0.25);
    }

  }


  /* ==========================================================================
     PRINT
     ========================================================================== */

  @media print {

    /*
     * Absolutely hide anything that isn't part
     * of the printable cards.
     *
     * !important is intentional here so that an
     * inline display:block from JavaScript cannot
     * cause the print button to appear.
     */
    #configuration,
    #print-controls,
    #error {
      display: none !important;
    }


    /*
     * Remove all browser-default document spacing.
     */
    html,
    body {
      width: 11in;
      height: auto;

      margin: 0;
      padding: 0;

      background: white;
    }


    /*
     * The cards container itself must not introduce
     * any additional spacing.
     */
    #pages {
      display: block !important;

      margin: 0;
      padding: 0;
    }


    /*
     * Printed page.
     */
    .print-page {
      width: 11in;
      height: 8.5in;

      /*
       * Exactly 0.25" on all sides.
       */
      margin: 0;
      padding: 0.25in;

      background: white;

      /*
       * No screen-preview shadow.
       */
      box-shadow: none;

      /*
       * 3 × 3 cards.
       */
      display: grid;

      grid-template-columns:
        repeat(3, 2.5in);

      grid-template-rows:
        repeat(2, 3.5in);

      /*
       * No gaps between cards.
       */
      gap: 0;

      /*
       * Center the card grid horizontally.
       */
      justify-content: center;

      /*
       * Cards begin immediately after
       * the 0.25" top padding.
       */
      align-content: center;

      /*
       * Each page begins on a new printed page.
       */
      break-after: page;
      page-break-after: always;
    }


    /*
     * Don't add an unnecessary blank page after
     * the final set of cards.
     */
    .print-page:last-child {
      break-after: auto;
      page-break-after: auto;
    }


    /*
     * Printed card dimensions.
     */
    .card {
      width: 2.5in;
      height: 3.5in;

      margin: 0;
      padding: 0;
      border: 0;

      display: block;

      object-fit: fill;

      break-inside: avoid;

      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
  }
</style>

        // =========================================================================
        // Champion key
        // =========================================================================

        function championKey(name) {

            return name
                .toString()
                .trim()
                .toLowerCase()
                .replace(/[^a-z0-9]/g, '');

        }


        // =========================================================================
        // Flatten champion data
        // =========================================================================

        const allChampions =
            Object.values(championData).flat();


        // =========================================================================
        // Get all source versions for a champion
        //
        // Every champion has at least Official.
        //
        // A champion in Community gets:
        //   Official
        //   Community
        //
        // A champion in Experimental gets:
        //   Official
        //   Experimental
        //
        // A champion in both gets:
        //   Official
        //   Community
        //   Experimental
        // =========================================================================

        function getChampionSources(champion) {

            const sources = [
                "official"
            ];


            if (
                communityChampionData.Community[champion.name]
            ) {
                sources.push("community");
            }


            if (
                communityChampionData.Experimental[champion.name]
            ) {
                sources.push("experimental");
            }


            return sources;
        }


        // =========================================================================
        // Get card URL
        // =========================================================================

        function getCardUrls(champion, source) {

            const championType = champion.type;
            const key = championKey(champion.name);

            let basePath;

            switch (source) {

                case "official":
                    basePath =
                        "../assets/champion-cards/webp/";
                    break;

                case "community":
                    basePath =
                        "../assets/champion-cards/community-balance/v1/webp/";
                    break;

                case "experimental":
                    basePath =
                        "../assets/champion-cards/community-balance/webp/";
                    break;

                default:
                    return [];
            }


            const prefix =
                `${championType}-${key}-`;


            // return [
            //     `${basePath}${prefix}trait.webp`,
            //     `${basePath}${prefix}champion-plot.webp`,
            //     `${basePath}${prefix}champion-clash.webp`,
            //     `${basePath}${prefix}traitback.webp`,
            //     `${basePath}${prefix}followers-plot.webp`,
            //     `${basePath}${prefix}followers-clash.webp`
            // ];

            return [
                `${basePath}${prefix}champion-plot.webp`,
                `${basePath}${prefix}trait.webp`,
                `${basePath}${prefix}followers-plot.webp`,
                `${basePath}${prefix}champion-clash.webp`,
                `${basePath}${prefix}traitback.webp`,
                `${basePath}${prefix}followers-clash.webp`
            ];
        }


        // =========================================================================
        // Get icon URL
        // =========================================================================

        function getIconUrl(champion) {

            const championType =
                champion.type;

            const key =
                championKey(champion.name);

            return (
                `../assets/champion-icons/` +
                `${championType}-${key}.png`
            );
        }


        // =========================================================================
        // Create a unique checkbox ID
        // =========================================================================

        function checkboxId(champion, source) {

            return (
                `${championKey(champion.name)}-${source}`
            );
        }

        // Display error
        // =========================================================================

            document.getElementById(

            document.getElementById(

            ).style.display = "none";

            document.getElementById(

            const error =
                document.getElementById("error");

            error.textContent =
                message;

            error.style.display =
                "block";
        }


        // =========================================================================
        // Build champion selection UI
        // =========================================================================

        function buildChampionSelection() {

            const container =
                document.getElementById(
                    "champion-checkboxes"
                );

            container.innerHTML = "";


            for (
                const [groupName, champions]
                of Object.entries(championData)
            ) {

                const group =
                    document.createElement("div");

                group.className =
                    "champion-group";


                const heading =
                    document.createElement("h3");

                heading.textContent =
                    groupName;

                group.appendChild(
                    heading
                );


                for (
                    const champion of champions
                ) {

                    const sources =
                        getChampionSources(
                            champion
                        );


                    /*
                     * Create one checkbox for EVERY source
                     * that exists for this champion.
                     */
                    for (
                        const source of sources
                    ) {

                        const label =
                            document.createElement("label");

                        label.className =
                            "champion-checkbox";


                        const checkbox =
                            document.createElement("input");

                        checkbox.type =
                            "checkbox";

                        checkbox.name =
                            "champion";

                        checkbox.id =
                            checkboxId(
                                champion,
                                source
                            );

                        /*
                         * The value contains both the champion
                         * key and the source so that the two versions
                         * can coexist in the generated URL.
                         */
                        checkbox.value =
                            `${championKey(champion.name)}:${source}`;


                        // ---------------------------------------------------------------
                        // Icon
                        // ---------------------------------------------------------------

                        const iconLink =
                            document.createElement("a");

                        iconLink.className =
                            "champion-icon-link";

                        iconLink.href =
                            getIconUrl(champion);

                        iconLink.target =
                            "_blank";

                        iconLink.rel =
                            "noopener";


                        const icon =
                            document.createElement("img");

                        icon.className =
                            "champion-icon";

                        icon.src =
                            getIconUrl(champion);

                        icon.alt =
                            "";


                        iconLink.appendChild(
                            icon
                        );


                        // ---------------------------------------------------------------
                        // Label
                        // ---------------------------------------------------------------

                        const name =
                            document.createTextNode(
                                `${champion.name} ` +
                                `(${capitalize(source)})`
                            );


                        label.appendChild(
                            checkbox
                        );

                        label.appendChild(
                            iconLink
                        );

                        label.appendChild(
                            name
                        );


                        group.appendChild(
                            label
                        );
                    }
                }


                container.appendChild(
                    group
                );
            }
        }

        // =========================================================================
        // Build scenario selection UI
        // =========================================================================


        function buildScenarioSelection() {
            const container = document.getElementById("scenario-checkboxes");
            container.innerHTML = "";

            for (const [groupName, scenarios] of Object.entries(scenarioData)) {
                const group = document.createElement("div");
                group.className = "scenario-group";

                const heading = document.createElement("h3");
                heading.textContent = groupName;
                group.appendChild(heading);

                for (const scenario of scenarios) {
                    const label = document.createElement("label");
                    label.className = "scenario-checkbox";

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.name = "scenario";
                    checkbox.value = scenario.key;

                    label.appendChild(checkbox);

                    const text = document.createTextNode(scenario.name);
                    label.appendChild(text);

                    group.appendChild(label);
                }

                container.appendChild(group);
            }
        }

        // =========================================================================
        // Capitalize source name
        // =========================================================================

        function capitalize(value) {

            return (
                value.charAt(0).toUpperCase() +
                value.slice(1)
            );
        }

        // =========================================================================
        // MISC
        // =========================================================================

        function findScenarioByKey(key) {
            for (const scenarios of Object.values(scenarioData)) {
                const scenario = scenarios.find(s => s.key === key);

                if (scenario) {
                    return scenario;
                }
            }

            return null;
        }

        // =========================================================================
        // Select all cards for a particular source
        // =========================================================================

        function selectBySource(source) {

            document
                .querySelectorAll(
                    'input[name="champion"]'
                )
                .forEach(checkbox => {

                    checkbox.checked =
                        checkbox.value.endsWith(
                            `:${source}`
                        );
                });
        }

        // =========================================================================
        // Select scenarios by group
        // =========================================================================

        function selectScenariosByGroup(groupName) {

            const scenarioKeys =
                scenarioData[groupName].map(
                    scenario => scenario.key
                );

            document
                .querySelectorAll(
                    'input[name="scenario"]'
                )
                .forEach(checkbox => {

                    checkbox.checked =
                        scenarioKeys.includes(
                            checkbox.value
                        );
                });
        }

        function selectNoScenarios() {

            document
                .querySelectorAll(
                    'input[name="scenario"]'
                )
                .forEach(checkbox => {

                    checkbox.checked = false;
                });
        }


        // =========================================================================
        // Select Community + Experimental
        // =========================================================================

        function selectCommunityAndExperimental() {

            document
                .querySelectorAll(
                    'input[name="champion"]'
                )
                .forEach(checkbox => {

                    checkbox.checked =
                        checkbox.value.endsWith(
                            ":community"
                        ) ||
                        checkbox.value.endsWith(
                            ":experimental"
                        );
                });
        }


        // =========================================================================
        // Select none
        // =========================================================================

        function selectNone() {

            document
                .querySelectorAll(
                    'input[name="champion"]'
                )
                .forEach(
                    checkbox =>
                        checkbox.checked = false
                );
        }


        // =========================================================================
        // Generate printable URL
        // =========================================================================

        function generateCards() {
            const championSelections = Array.from(
                document.querySelectorAll('input[name="champion"]:checked')
            ).map(checkbox => checkbox.value);

            const scenarioSelections = Array.from(
                document.querySelectorAll('input[name="scenario"]:checked')
            ).map(checkbox => checkbox.value);

            const params = new URLSearchParams();

            // Preserve the existing champion type parameter.
            const type = document.querySelector('input[name="champion"]:checked')
                ?.value
                ?.split(":")[1];

            if (type) {
                params.set("type", type);
            }

            if (championSelections.length > 0) {
                params.set("champions", championSelections.join(","));
            }

            if (scenarioSelections.length > 0) {
                params.set("scenarios", scenarioSelections.join(","));
            }

            window.location.href = `?${params.toString()}`;
        }


        // =========================================================================
        // Parse a champion/source selection
        // =========================================================================

        function parseSelection(value) {

            const parts =
                value.split(":");


            return {
                key: parts[0],
                source: parts[1] || null
            };
        }


        // =========================================================================
        // Find champion by key
        // =========================================================================

        function findChampionByKey(key) {

            return allChampions.find(
                champion =>
                    championKey(
                        champion.name
                    ) === key
            );
        }


        // =========================================================================
        // Render printable cards
        // =========================================================================

        function buildCards(selections, scenarioKeys) {
            const cards = [];

            // Champion cards
            for (const selection of selections) {
                const cardUrls = getCardUrls(
                    selection.champion,
                    selection.source
                );

                for (const path of cardUrls) {
                    cards.push({
                        path,
                        alt: `${selection.champion.name} card`
                    });
                }
            }

            // Scenario cards
            for (const key of scenarioKeys) {
                const scenario = findScenarioByKey(key);

                if (!scenario) {
                    continue;
                }

                cards.push({
                    path: scenario.path,
                    alt: `${scenario.name} scenario`,
                    isScenario: true
                });
            }

            return cards;
        }

        function renderCards(cards) {
            const pagesContainer = document.getElementById("pages");
            pagesContainer.innerHTML = "";
            pagesContainer.style.display = "block";

            for (let i = 0; i < cards.length; i += CARDS_PER_PAGE) {
                const pageCards = cards.slice(i, i + CARDS_PER_PAGE);

                const page = document.createElement("div");
                page.className = "print-page";

                for (let cardIndex = 0; cardIndex < pageCards.length; cardIndex++) {
                    const card = pageCards[cardIndex];

                    const img = document.createElement("img");
                    img.className = "card";

                    // The first three cards on every page are printed upside-down.
                    if (!card.isScenario && cardIndex < 3) {
                        img.classList.add("upside-down");
                    }

                    img.src = card.path;
                    img.alt = card.alt || "";

                    img.onerror = () => {
                        showError(`Unable to load card image: ${card.path}`);
                    };

                    page.appendChild(img);
                }

                pagesContainer.appendChild(page);
            }
        }

        // =========================================================================
        // Build printable page from URL parameters
        // =========================================================================

        function buildPrintablePage() {
            const params = new URLSearchParams(window.location.search);

            const type = params.get("type");
            const championParam = params.get("champions");
            const scenarioParam = params.get("scenarios");

            const scenarioKeys = scenarioParam
                ? scenarioParam.split(",").filter(Boolean)
                : [];


            const validTypes = [
                "official",
                "community",
                "experimental"
            ];


            // -----------------------------------------------------------------------
            // No parameters = configuration
            // -----------------------------------------------------------------------

            if (!type && !championParam && !scenarioParam) {

                document.getElementById(
                    "configuration"
                ).style.display =
                    "block";


                buildChampionSelection();
                buildScenarioSelection();

                return;
            }


            // -----------------------------------------------------------------------
            // Validate type
            // -----------------------------------------------------------------------

            if (
                (type && !validTypes.includes(type))
                // || (championParam && !type)
            ) {

                showError(
                    'Invalid type. The "type" parameter must be ' +
                    '"official", "community", or "experimental".'
                );

                return;
            }


            // -----------------------------------------------------------------------
            // Read champions
            // -----------------------------------------------------------------------

            const championsParam =
                params.get("champions");


            let selections = [];


            /*
             * If no champions are specified, select ALL
             * versions associated with the requested type.
             *
             * Official:
             *   every official card
             *
             * Community:
             *   every community card
             *
             * Experimental:
             *   every experimental card
             */
            if (!championsParam) {

                for (
                    const champion of allChampions
                ) {

                    const sources =
                        getChampionSources(
                            champion
                        );


                    if (
                        sources.includes(type)
                    ) {

                        selections.push({
                            champion: champion,
                            source: type
                        });
                    }
                }
            }


            /*
             * Explicit champion selections.
             */
            else {

                const requestedSelections =
                    championsParam
                        .split(",")
                        .map(value =>
                            value.trim().toLowerCase()
                        )
                        .filter(
                            value =>
                                value.length > 0
                        );


                const invalidSelections = [];


                for (
                    const requestedSelection
                    of requestedSelections
                ) {

                    const parsed =
                        parseSelection(
                            requestedSelection
                        );


                    const champion =
                        findChampionByKey(
                            parsed.key
                        );


                    // ---------------------------------------------------------------
                    // Champion key doesn't exist
                    // ---------------------------------------------------------------

                    if (!champion) {

                        invalidSelections.push(
                            requestedSelection
                        );

                        continue;
                    }


                    // ---------------------------------------------------------------
                    // Source wasn't specified
                    //
                    // For backwards compatibility, use the URL's type.
                    // ---------------------------------------------------------------

                    const source =
                        parsed.source || type;


                    // ---------------------------------------------------------------
                    // Validate source
                    // ---------------------------------------------------------------

                    if (
                        !validTypes.includes(source)
                    ) {

                        invalidSelections.push(
                            requestedSelection
                        );

                        continue;
                    }


                    // ---------------------------------------------------------------
                    // Validate that this champion actually has this source.
                    // ---------------------------------------------------------------

                    const sources =
                        getChampionSources(
                            champion
                        );


                    if (
                        !sources.includes(source)
                    ) {

                        invalidSelections.push(
                            requestedSelection
                        );

                        continue;
                    }


                    selections.push({
                        champion: champion,
                        source: source
                    });
                }


                /*
                 * If ANY requested selection is invalid,
                 * show only an error.
                 */
                if (
                    invalidSelections.length > 0
                ) {

                    showError(
                        `Invalid champion selection(s): ` +
                        `${invalidSelections.join(", ")}`
                    );

                    return;
                }


                if (
                    selections.length === 0
                ) {

                    showError(
                        'The "champions" parameter did not contain ' +
                        'any valid champion selections.'
                    );

                    return;
                }
            }


            // -----------------------------------------------------------------------
            // Show print controls
            // -----------------------------------------------------------------------

            document.getElementById(
                "print-controls"
            ).style.display =
                "block";


            // -----------------------------------------------------------------------
            // Render
            // -----------------------------------------------------------------------

            const cards = buildCards(selections, scenarioKeys);

            if (cards.length === 0) {
                showError("No champions or scenarios were selected.");
                return;
            }

            renderCards(cards);
        }


        // =========================================================================
        // Selection link handlers
        // =========================================================================

        document
            .querySelectorAll(
                ".selection-links a"
            )
            .forEach(link => {

                link.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();


                        const selection =
                            this.dataset.selection;


                        switch (selection) {

                            case "official":
                                selectBySource(
                                    "official"
                                );
                                break;


                            case "community":
                                selectBySource(
                                    "community"
                                );
                                break;


                            case "experimental":
                                selectBySource(
                                    "experimental"
                                );
                                break;


                            case "community-experimental":
                                selectCommunityAndExperimental();
                                break;


                            case "none":
                                selectNone();
                                break;
                        }
                    }
                );
            });

        // =========================================================================
        // Scenario selection link handlers
        // =========================================================================

        document
            .querySelectorAll(
                ".scenario-selection-links a"
            )
            .forEach(link => {

                link.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();

                        const selection =
                            this.dataset.scenarioSelection;

                        switch (selection) {

                            case "official-competitive":
                                selectScenariosByGroup(
                                    "Official (Competitive)"
                                );
                                break;

                            case "official-out-of-rotation":
                                selectScenariosByGroup(
                                    "Official (Out of Rotation)"
                                );
                                break;

                            case "community":
                                selectScenariosByGroup(
                                    "Community"
                                );
                                break;

                            case "none":
                                selectNoScenarios();
                                break;
                        }
                    }
                );
            });


        // =========================================================================
        // Generate button
        // =========================================================================

        document
            .getElementById(
                "generate-button"
            )
            .addEventListener(
                "click",
                generateCards
            );


        // =========================================================================
        // Start
        // =========================================================================

        buildPrintablePage();

    </script>

</body>

</html>
